name: quality-gates-ml

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality_ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-ml.txt

      - name: Run advanced backend quality gate
        run: bash scripts/ci_quality_gate_ml.sh

      - name: Upload refreshed project status snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-scope-status
          path: PROJECT_SCOPE_AND_STATUS.md
