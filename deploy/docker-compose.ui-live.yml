services:
  cdp-ui-live-dev:
    profiles: ["dev"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui-live
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
    command: ["python3", "scripts/ui_live_server.py", "--host", "0.0.0.0", "--port", "8080"]

  cdp-ui-live-demo:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui-live
    ports:
      - "8081:8080"
    volumes:
      - ../artifacts:/app/artifacts
      - ../ui/data:/app/ui/data
    command: ["python3", "scripts/ui_live_server.py", "--host", "0.0.0.0", "--port", "8080"]

  cdp-ui-live-prod-sim:
    profiles: ["prod-sim"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui-live
    ports:
      - "8082:8080"
    volumes:
      - ../artifacts:/app/artifacts:ro
      - ../ui/data:/app/ui/data:ro
    command: ["python3", "scripts/ui_live_server.py", "--host", "0.0.0.0", "--port", "8080"]
